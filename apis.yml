aid: good-leap
name: Good Leap
description: >-
  GoodLeap (formerly Loanpal) is a fintech platform providing point-of-sale financing for sustainable
  home improvements — solar and battery storage, efficient heating and cooling, roofing and ventilation,
  water conservation, and energy-efficient windows. Its Developer API (v2, POS financing) lets approved
  partners originate and manage home-improvement loans through the full lifecycle: authentication and
  elevation, offers and payment calculation, loan submission, status and timeline tracking, case
  (stipulation) management, document upload via pre-signed URLs, project and milestone management,
  change orders, notes, tags, and user management. Authentication is JWT bearer; partner credentials
  from developer.goodleap.com are required. This profile was surfaced as a portfolio company of Ribbit
  Capital and enriched from GoodLeap's public developer surface (developer portal + public Postman
  collection).
